rules:
  # Only live keys are critical. A test-mode key can still move test money, but
  # it is not a production credential, and reporting it at CRITICAL is what made
  # the documented example key in Stripe's own docs read as a leak. It lives in
  # its own low-severity rule below.
  #
  # min_entropy rejects the shape-only decoys: `sk_live_` followed by zeros (or
  # any single repeated character) matches the alphabet and length of a real key
  # but carries ~1.4 bits/char, while a real 24-character base62 suffix carries
  # ~4. Without the floor the decoy is indistinguishable from a key, and it is a
  # fixture people check in precisely because it is obviously fake.
  - id: stripe-secret-key
    type: regex
    name: Stripe Secret Key
    description: Stripe payment processor live secret API key
    severity: critical
    tags: [stripe, payments, credentials]
    patterns:
      - regex: '\b(sk_live_[0-9a-zA-Z]{24,})\b'
        confidence: 0.95
        min_entropy: 3.0

  - id: stripe-test-key
    type: regex
    name: Stripe Test Secret Key
    description: Stripe test-mode secret key (not a production credential)
    severity: low
    tags: [stripe, payments, test-key]
    patterns:
      - regex: '\b(sk_test_[0-9a-zA-Z]{24,})\b'
        confidence: 0.50
        min_entropy: 2.0

  - id: stripe-publishable-key
    type: regex
    name: Stripe Publishable Key
    description: Stripe payment processor publishable key
    severity: medium
    tags: [stripe, payments, api-key]
    patterns:
      - regex: '\b(pk_live_[0-9a-zA-Z]{24,})\b'
        confidence: 0.70
      - regex: '\b(pk_test_[0-9a-zA-Z]{24,})\b'
        confidence: 0.50

  - id: stripe-restricted-key
    type: regex
    name: Stripe Restricted Key
    description: Stripe payment processor restricted API key
    severity: high
    tags: [stripe, payments, credentials]
    patterns:
      - regex: '\b(rk_live_[0-9a-zA-Z]{24,})\b'
        confidence: 0.85
      - regex: '\b(rk_test_[0-9a-zA-Z]{24,})\b'
        confidence: 0.70

  - id: stripe-webhook-secret
    type: regex
    name: Stripe Webhook Secret
    description: Stripe webhook endpoint secret
    severity: high
    tags: [stripe, payments, credentials]
    patterns:
      - regex: '\b(whsec_[0-9a-zA-Z]{32,})\b'
        confidence: 0.90
