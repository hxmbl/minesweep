rules:
  - id: ssh-private-key
    type: regex
    name: SSH Private Key
    description: SSH private key in any PEM wrapper (PKCS#1/PKCS#8/OpenSSH, encrypted or not)
    severity: critical
    tags: [ssh, credentials, private-key]
    patterns:
      # Any number of uppercase words between BEGIN and PRIVATE KEY covers
      # PKCS#8 (`BEGIN PRIVATE KEY`), `ENCRYPTED PRIVATE KEY`, and the legacy
      # RSA/DSA/EC/OpenSSH wrappers without enumerating every algorithm.
      - regex: -----BEGIN ([A-Z0-9]+ )*PRIVATE KEY-----
        confidence: 0.95

  # A public key is meant to be shared: it is the private half that is the
  # secret. This rule used to report public-key lines at HIGH, which meant a
  # checked-in `id_rsa.pub` fixture (a normal thing to have in a repo) read as a
  # leaked credential and could block a commit. The finding is kept, because a
  # pasted authorized_keys line still tells you a key is trusted somewhere, but
  # at LOW it is context rather than an incident. `*.pub` files are excluded
  # outright — the extension is the author asserting the file holds the public
  # half — while `authorized_keys` files and inline copies still match.
  # Private-key detection is unaffected: ssh-private-key stays critical.
  - id: ssh-authorized-keys
    type: regex
    name: SSH Authorized Keys
    description: SSH authorized_keys entry (public key, not a secret)
    severity: low
    tags: [ssh, public-key]
    patterns:
      # The key-type token is open-ended: any alphanumeric identifier (with
      # dots, underscores, @ or + for vendor/security-key types) followed by a
      # base64 body. Old rules listed algorithms one by one and silently missed
      # new ones; `*` alone is not a Go-regexp wildcard, `\S+` / this class is.
      - regex: \b[A-Za-z0-9][A-Za-z0-9._@+/-]*\s+AAAA[0-9A-Za-z+/]+[=]{0,3}(\s|$)
        confidence: 0.90
    file_filter:
      exclude:
        - "*.pub"

  - id: pgp-private-key
    type: regex
    name: PGP Private Key Block
    description: PGP private key block
    severity: critical
    tags: [pgp, credentials, private-key]
    patterns:
      - regex: -----BEGIN PGP PRIVATE KEY BLOCK-----
        confidence: 0.95
