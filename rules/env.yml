rules:
  - id: env-database-url
    type: regex
    name: Database URL
    description: Database connection URL in environment variable
    severity: high
    tags: [env, database, credentials]
    patterns:
      # Credentials are required, as they are by the equivalent patterns in
      # detectors/database.go. Without that requirement this rule reported
      # `DATABASE_URL=postgres://localhost:5432/mydb` as a HIGH secret — a
      # connection string with no user and no password in it — while the Go
      # detector correctly ignored the same string. Two rules disagreeing about
      # what a database URL is means the looser one defines the user experience.
      #
      # capture_group isolates the URL from the `DATABASE_URL=` prefix, so the
      # reported value is the connection string rather than the whole
      # assignment. See detectors.credentialValue.
      - regex: (?i)(?:DATABASE_URL|MONGODB_URI|MYSQL_URL|REDIS_URL|REDISCLOUD_URL)[ \t]*[:=][ \t]*["']?((?:postgres(?:ql)?|mysql|sqlite|mongodb|redis)(?:\+\w+)?://[^:\s"']+:[^@\s"']+@[^\s"']+)
        confidence: 0.90
        capture_group: 1
        require_value: true

  # The four rules below capture "whatever follows the sign". In source code that
  # is frequently an expression rather than a literal — `token = state.get(
  # "token")`, `api_key = lookup("api_key")`. require_value discards those
  # captures (see detectors.looksLikeCredentialValue) so a credential-shaped
  # identifier is not reported on its own.

  - id: env-password
    type: regex
    name: Password Variable
    description: Password value in variable assignment
    severity: high
    tags: [env, credentials]
    patterns:
      - regex: (?i)(password|passwd|pwd|secret)[ \t]*[:=][ \t]*["']?[^\s"']{8,}
        confidence: 0.60
        require_value: true

  - id: env-api-key
    type: regex
    name: API Key Variable
    description: API key in environment variable
    severity: medium
    tags: [env, credentials, api-key]
    patterns:
      - regex: (?i)(API_KEY|API_SECRET|APP_SECRET|CONSUMER_KEY|CONSUMER_SECRET)[ \t]*[:=][ \t]*["']?[^\s"']{8,}
        confidence: 0.75
        require_value: true

  - id: env-token
    type: regex
    name: Token Variable
    description: Token value in environment variable
    severity: medium
    tags: [env, credentials]
    patterns:
      - regex: (?i)(TOKEN|ACCESS_TOKEN|SECRET_TOKEN|AUTH_TOKEN)[ \t]*[:=][ \t]*["']?[^\s"']{8,}
        confidence: 0.65
        require_value: true

  - id: env-private-key-path
    type: regex
    name: Private Key Path
    description: Reference to private key file in environment
    severity: high
    tags: [env, credentials, private-key]
    patterns:
      - regex: (?i)(PRIVATE_KEY|SSH_KEY|PEM_FILE)[ \t]*[:=][ \t]*["']?[^\s"']{8,}
        confidence: 0.70
        require_value: true

  # This canary captures the value, not just the name. It used to match only
  # `SIGNING_KEY=` and reported that two-character string as the finding's value,
  # which meant the report showed a meaningless value, the evidence line was
  # censored as though `SIGNING_KEY=` were the secret, and a placeholder such as
  # `SIGNING_KEY=dummy-value-not-real` was indistinguishable from a real leak.
  # require_value now judges the value, so a placeholder is not reported while a
  # literal still is.
  - id: env-generic-credential
    type: regex
    name: Generic Credential Variable
    description: Variable name suggesting credential content
    severity: low
    tags: [env, credentials]
    patterns:
      - regex: (?mi)^(SECRET|PASSWORD|TOKEN|KEY|CREDENTIALS|SIGNING_KEY)=("?)([^\r\n]*)$
        confidence: 0.50
        capture_group: 3
        require_value: true
