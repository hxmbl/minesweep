rules:
  - id: env-database-url
    type: regex
    name: Database URL
    description: Database connection URL in environment variable
    severity: high
    tags: [env, database, credentials]
    patterns:
      - regex: (?i)(DATABASE_URL|MONGODB_URI|MYSQL_URL|REDIS_URL|REDISCLOUD_URL)\s*[:=]\s*["']?(postgres|mysql|sqlite|mongodb|redis)://[^\s"']+
        confidence: 0.90

  - id: env-password
    type: regex
    name: Password Variable
    description: Password value in variable assignment
    severity: high
    tags: [env, credentials]
    patterns:
      - regex: (?i)(password|passwd|pwd|secret)\s*[:=]\s*["']?[^\s"']{8,}
        confidence: 0.60

  - id: env-api-key
    type: regex
    name: API Key Variable
    description: API key in environment variable
    severity: medium
    tags: [env, credentials, api-key]
    patterns:
      - regex: (?i)(API_KEY|API_SECRET|APP_SECRET|CONSUMER_KEY|CONSUMER_SECRET)\s*[:=]\s*["']?[^\s"']+
        confidence: 0.75

  - id: env-token
    type: regex
    name: Token Variable
    description: Token value in environment variable
    severity: medium
    tags: [env, credentials]
    patterns:
      - regex: (?i)(TOKEN|ACCESS_TOKEN|SECRET_TOKEN|AUTH_TOKEN)\s*[:=]\s*["']?[^\s"']{8,}
        confidence: 0.65

  - id: env-private-key-path
    type: regex
    name: Private Key Path
    description: Reference to private key file in environment
    severity: high
    tags: [env, credentials, private-key]
    patterns:
      - regex: (?i)(PRIVATE_KEY|SSH_KEY|PEM_FILE)\s*[:=]\s*["']?[^\s"']+
        confidence: 0.70

  - id: env-generic-credential
    type: regex
    name: Generic Credential Variable
    description: Variable name suggesting credential content
    severity: low
    tags: [env, credentials]
    patterns:
      - regex: (?mi)^(SECRET|PASSWORD|TOKEN|KEY|CREDENTIALS|SIGNING_KEY)=
        confidence: 0.50
