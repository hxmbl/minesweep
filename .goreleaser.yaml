version: 2

project_name: minesweep

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/minesweep
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.toolVersion={{.Version}}

archives:
  - name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

brews:
  - name: minesweep
    repository:
      owner: Hxmbl
      name: homebrew-minesweep
    commit_author:
      name: hxmbl
      email: hxmbl@users.noreply.github.com
    homepage: https://github.com/Hxmbl/minesweep
    description: Policy-driven secrets and sensitive data scanner with git history forensics
    test: |
      system "#{bin}/minesweep", "version"
