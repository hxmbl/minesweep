name: MineSweep
description: Scan a repository for secrets with MineSweep.
author: hxmbl
branding:
  icon: shield
  color: gray-dark

inputs:
  args:
    description: Scan flags and target, passed to minesweep as-is.
    required: false
    default: --fail-on high --no-inline-suppressions .
  sarif:
    description: >-
      Write SARIF to this path (relative to the workspace) instead of the
      terminal report. The exit code still decides the step.
    required: false
    default: ""

runs:
  using: docker
  # By default this action runs the mutable major-line image. For deterministic
  # CI, pin the action to an exact release ref and override `image:` in a forked
  # action or use the published image ghcr.io/hxmbl/minesweep:vX.Y.Z directly.
  image: docker://ghcr.io/hxmbl/minesweep:v2
  entrypoint: /usr/local/bin/minesweep-action
