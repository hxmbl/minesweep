# golangci-lint v2 configuration.
#
# This was a v1-schema file. It worked only because CI resolved
# `version: latest` with `install-mode: goinstall`, which silently installed a
# v1.x release; the documented `golangci-lint run` failed outright with
# "unsupported version of the configuration". Pinning the linter to v2 without
# migrating this file would have traded a silent failure for a loud one, so both
# halves were changed together.
version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gosec
    - misspell
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: unused-parameter
          disabled: true
        - name: empty-block
          disabled: true
        - name: redefines-builtin-id
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - _test\.go

run:
  timeout: 5m
  tests: true
