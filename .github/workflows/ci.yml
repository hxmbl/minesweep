name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_release:
        description: 'Run release job'
        required: false
        type: boolean
        default: false

# Least privilege by default. The previous workflow-level
# `permissions: contents: write` handed write access to the repository to every
# job, including test and lint, which run third-party actions.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        go-version: ["1.26"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Run tests repeatedly to shake out order-dependent failures
        run: go test -count=3 ./...

      - name: Upload coverage
        if: matrix.go-version == '1.26'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run golangci-lint
        # v6 was the first release to drop the default `github-actions` output
        # format and the `--out-format` flag it passed to the binary. Both were
        # removed in golangci-lint v2, so on v4 the action installed the linter
        # correctly and then failed to invoke it:
        #   Error: unknown flag: --out-format
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned to the release the v2 .golangci.yml was verified against,
          # and pinned rather than `latest`: `version: latest` with
          # `install-mode: goinstall` silently resolved to a v1.x release, which
          # is why the v1-schema config had never been noticed as a problem —
          # the linter could not upgrade.
          #
          # The default `binary` installer is required. golangci-lint v2 moved
          # to the module path github.com/golangci/golangci-lint/v2, and the
          # action builds the `goinstall` argument itself without the major
          # version suffix, so `goinstall` cannot resolve any v2 release:
          #   invalid version: unknown revision cmd/golangci-lint/v2.1.6
          version: v2.13.1

  build:
    name: Build (Linux)
    runs-on: ubuntu-latest
    needs: [test, lint]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        run: go build -o minesweep ./cmd/minesweep

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: minesweep-linux-amd64
          path: minesweep

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    needs: [test, lint]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        run: go build -o minesweep ./cmd/minesweep

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: minesweep-darwin-amd64
          path: minesweep

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, lint]
    # Write access is scoped to this job alone: it is the only one that needs it.
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.run_release == true)
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Do not leave the job token in .git/config. The release job is the
          # one that also holds the Homebrew tap credential, so a stray token in
          # the remote config widens the blast radius of anything that runs
          # git against the checkout.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # `go mod tidy` used to run as a goreleaser before-hook, on the release
      # path: it could add or upgrade dependencies as part of producing a
      # release. `go mod verify` is the check that belongs there.
      - name: Verify dependencies are unchanged
        run: |
          go mod download
          go mod verify
          git diff --exit-code -- go.mod go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.5.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_GITHUB_TOKEN: ${{ secrets.TAP_RELEASE_KEY }}
