name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_release:
        description: 'Run release job'
        required: false
        type: boolean
        default: false

# Least privilege. This was `contents: write` at workflow scope, so the test,
# lint and build jobs all ran with a write-capable token (confirmed in the Lint
# job's own token log). Only the release job publishes anything, and it declares
# the permission it needs for itself.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Otherwise the job's token is written to .git/config and any git
          # command run by a test or a linter can use it.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: matrix.go-version == '1.26'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Otherwise the job's token is written to .git/config and any git
          # command run by a test or a linter can use it.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run golangci-lint
        # Pinned to a version, not `latest`. With action@v4 + `version: latest`
        # + `install-mode: goinstall` this silently resolved to v1.64.8, which is
        # the only reason the old v1-schema .golangci.yml kept working and the
        # reason the linter could never upgrade itself.
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13
          install-mode: binary

  build:
    name: Build (Linux)
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Otherwise the job's token is written to .git/config and any git
          # command run by a test or a linter can use it.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        run: go build -o minesweep ./cmd/minesweep

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: minesweep-linux-amd64
          path: minesweep

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    needs: [test, lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Otherwise the job's token is written to .git/config and any git
          # command run by a test or a linter can use it.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        run: go build -o minesweep ./cmd/minesweep

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: minesweep-darwin-amd64
          path: minesweep

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.run_release == true)
    # The only job that publishes anything, so the only one that needs write.
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Otherwise the job's token is written to .git/config and any git
          # command run by a test or a linter can use it. GoReleaser does not
          # need it: it authenticates with its own token.
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          # Pinned: `latest` means a new goreleaser major can change the output
          # layout and break releases without any change to this repository.
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_GITHUB_TOKEN: ${{ secrets.TAP_RELEASE_KEY }}
