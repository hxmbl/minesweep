name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run tests
        run: go test -race ./...

      - name: Build binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -o minesweep-linux-amd64 ./cmd/minesweep
          GOOS=linux GOARCH=arm64 go build -o minesweep-linux-arm64 ./cmd/minesweep
          GOOS=darwin GOARCH=amd64 go build -o minesweep-darwin-amd64 ./cmd/minesweep
          GOOS=darwin GOARCH=arm64 go build -o minesweep-darwin-arm64 ./cmd/minesweep
          GOOS=windows GOARCH=amd64 go build -o minesweep-windows-amd64.exe ./cmd/minesweep

      - name: Create checksums
        run: |
          sha256sum minesweep-linux-amd64 minesweep-linux-arm64 minesweep-darwin-amd64 minesweep-darwin-arm64 minesweep-windows-amd64.exe > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            minesweep-linux-amd64
            minesweep-linux-arm64
            minesweep-darwin-amd64
            minesweep-darwin-arm64
            minesweep-windows-amd64.exe
            checksums.txt
