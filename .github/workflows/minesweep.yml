name: minesweep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # for SARIF upload

jobs:
  minesweep:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # needed for --diff
          # Otherwise the job's token is left in .git/config, and this job runs
          # a scanner over untrusted PR content.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build minesweep
        run: go build -o minesweep ./cmd/minesweep

      # One scan produces both the gate and the SARIF. They used to be two
      # separate invocations: the gating scan failed the job, and a second
      # `minesweep --sarif .` under `continue-on-error` uploaded whatever that
      # run produced. So a scan that was truncated, or that did not cover the
      # diff being reviewed, still published results as if they were complete --
      # and on a pull_request the upload came from a FULL scan while the gate was
      # a DIFF scan.
      #
      # github.base_ref goes through the environment rather than being
      # interpolated into the script body: a branch name is attacker-controlled
      # and `${{ }}` expansion happens before the shell runs, so a branch called
      # `$(curl ...)` would execute on the runner.
      - name: Run minesweep (diff mode for PRs)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          ./minesweep --diff --diff-base "$BASE_REF" --fail-on high --sarif . > results.sarif

      - name: Run minesweep (full scan on main)
        if: github.event_name == 'push'
        run: |
          ./minesweep --fail-on high --sarif . > results.sarif

      # No continue-on-error: if the scan above failed, there is no trustworthy
      # result to publish, and failing loudly is the point. The upload itself is
      # allowed to fail so that a Code Scanning outage does not masquerade as a
      # secrets failure.
      - name: Upload SARIF results
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: minesweep-${{ github.event_name }}
        continue-on-error: true