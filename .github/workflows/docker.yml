name: Docker

# ghcr.io/hxmbl/minesweep for linux/amd64 and linux/arm64, used by action.yml.
#
# - A release tag (vX.Y.Z) pushes `vX.Y.Z`, `vX.Y`, `vX` and, unless it is a
#   pre-release, `latest`. Tags are pushed by hand, so the push event fires here
#   (GoReleaser's release, made with GITHUB_TOKEN, would fire no `release` event).
# - A pull request that touches the image builds it and smoke-tests it, pushing nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and push (v2.4.3)'
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'action.yml'
      - '.github/workflows/docker.yml'

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event.pull_request.number || inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  meta:
    name: Resolve the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      ref: ${{ steps.tag.outputs.ref }}
      push: ${{ steps.tag.outputs.push }}
      stable: ${{ steps.tag.outputs.stable }}
    steps:
      - name: Resolve
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          # Via the environment: a tag name may contain shell metacharacters.
          PUSH_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG=""
          case "$EVENT" in
            push) TAG="$PUSH_TAG" ;;
            workflow_dispatch) TAG="$INPUT_TAG" ;;
          esac
          if [ -z "$TAG" ]; then
            printf 'tag=\nref=\npush=false\nstable=false\n' | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s\n' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?'; then
            echo "::error::$TAG is not a release tag like v2.4.3"
            exit 1
          fi
          STABLE=true
          case "$TAG" in *-*) STABLE=false ;; esac
          printf 'tag=%s\nref=refs/tags/%s\npush=true\nstable=%s\n' "$TAG" "$TAG" "$STABLE" | tee -a "$GITHUB_OUTPUT"

  smoke:
    name: Smoke test (amd64)
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.meta.outputs.ref }}
          persist-credentials: false

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: minesweep:smoke
          cache-from: type=gha,scope=minesweep
          cache-to: type=gha,scope=minesweep,mode=max

      - name: Run and check
        run: |
          # GitHub runs this with bash -e; the checks read exit codes themselves.
          set +e -uo pipefail
          fail() { echo "::error::$*"; exit 1; }
          W="$RUNNER_TEMP/smoke"
          mkdir -p "$W/clean" "$W/dirty" "$W/space dir" "$W/suppress"
          echo 'fn main() {}' > "$W/clean/main.rs"
          echo 'fn main() {}' > "$W/space dir/main.rs"
          # Made at run time so no token-shaped string lives in the repository.
          TOKEN="ghp_$(head -c 400 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)"
          printf 'const TOKEN = "%s";\n' "$TOKEN" > "$W/dirty/config.js"
          printf 'const TOKEN = "%s"; // minesweep: ignore\n' "$TOKEN" > "$W/suppress/config.js"

          # As action.yml runs it: workspace mounted, entrypoint swapped, inputs as env.
          run_action() {
            docker run --rm -v "$W:/github/workspace" -w /github/workspace \
              -e GITHUB_WORKSPACE=/github/workspace -e INPUT_ARGS="$1" -e INPUT_SARIF="${2:-}" \
              --entrypoint /usr/local/bin/minesweep-action minesweep:smoke
          }

          if ! run_action "--fail-on high --no-inline-suppressions clean"; then fail "a clean tree did not pass"; fi
          if run_action "--fail-on high --no-inline-suppressions dirty"; then fail "a GitHub PAT did not fail the scan"; else rc=$?; [ "$rc" -eq 1 ] || fail "unexpected dirty scan exit code: $rc"; fi
          if run_action "--fail-on high --no-inline-suppressions suppress"; then fail "inline suppression marker bypassed CI gate"; else rc=$?; [ "$rc" -eq 1 ] || fail "unexpected suppression scan exit code: $rc"; fi
          if run_action "--fail-on high --no-inline-suppressions dirty" out.sarif; then fail "the SARIF run did not fail on a PAT"; else rc=$?; [ "$rc" -eq 1 ] || fail "unexpected SARIF scan exit code: $rc"; fi
          grep -q '"version": "2.1.0"' "$W/out.sarif" || fail "no valid SARIF was written"
          if run_action "--fail-on high --no-inline-suppressions 'space dir'"; then rc=0; else rc=$?; fi
          if [ $rc -ne 0 ] && [ $rc -ne 1 ]; then fail "path with spaces caused unexpected behavior (exit $rc)"; fi
          docker run --rm --entrypoint git minesweep:smoke --version || fail "git is missing from the image"
          echo "smoke ok"

  publish:
    name: Build (amd64, arm64)
    needs: [meta, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.meta.outputs.ref }}
          persist-credentials: false

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: needs.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: tags
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/minesweep
          flavor: latest=false
          tags: |
            type=semver,pattern=v{{version}},value=${{ needs.meta.outputs.tag }},enable=${{ needs.meta.outputs.tag != '' }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ needs.meta.outputs.tag }},enable=${{ needs.meta.outputs.tag != '' }}
            type=semver,pattern=v{{major}},value=${{ needs.meta.outputs.tag }},enable=${{ needs.meta.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ needs.meta.outputs.stable == 'true' }}
            type=ref,event=pr

      - name: Build${{ needs.meta.outputs.push == 'true' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.meta.outputs.push == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          cache-from: type=gha,scope=minesweep
          cache-to: type=gha,scope=minesweep,mode=max
